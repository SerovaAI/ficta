# Ficta proxy policy — installed to ~ficta/.ficta/config.toml by deploy/install.sh.
# This is the canonical fail-closed POC policy from apps/gateway/docs/poc-configuration.md:
# provider traffic stays paused until an enabled registry source is healthy and non-empty,
# secret-shape detection is on, and a detector outage blocks rather than forwards.

[registry]
require = true

[secret_shapes]
enabled = true

[pii]
enabled = true
backends = ["presidio"]
fail_closed = true

# Stable surrogate key, created once by deploy/install.sh (64 hex characters, owner ficta, mode 0600).
# require_stable_key makes the proxy exit at startup (status 2) when the key is missing or unusable,
# instead of falling back to a random per-process key that changes every surrogate on restart.
# Back the key up with the other deployment secrets; never regenerate it under a running deployment.
[surrogate]
key_file = "/var/lib/ficta/.ficta/surrogate.key"
require_stable_key = true

# Keep protected values inside paths covered in Gateway document/chat traffic.
[redaction]
redact_paths = true

# Resolve overlapping identifier classifications consistently in this reference profile.
[detection]
fail_closed = true
entity_priority = ["za-id-number", "credit-card"]

# Remove detected financial/national identifiers permanently; registered identifiers still restore.
[dispositions.destroy]
categories = ["credit-card", "za-id-number"]
