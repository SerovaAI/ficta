# gitleaks config for ficta.
#
# ficta is a secret-redaction tool, so some fixtures legitimately contain synthetic, secret-shaped
# values (JWTs, private keys, API-key-looking strings). Allowlist only those explicit values and
# locations so all other source and test content remains scanned.

title = "ficta gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic surrogate tokens used to test restoration and token-boundary handling."
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''FICTA_(?:PERSON_)?[0-9a-f]{32}''']
paths = [
  '''(^|.*/)apps/gateway/test/restore-validation\.test\.ts$''',
  '''(^|.*/)packages/engine/test/scope\.test\.ts$''',
]

[[allowlists]]
description = "Fixed synthetic surrogate key used by server and diagnostic tests."
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''']
paths = ['''(^|.*/)packages/ficta/test/doctor\.test\.ts$''', '''(^|.*/)packages/ficta/test/server\.test\.ts$''']

[[allowlists]]
description = "Synthetic detector inputs in the dedicated secret-shape test."
targetRules = ["generic-api-key", "jwt", "private-key"]
condition = "AND"
regexes = [
  '''aB3dE5fG7hJ9kLmN2pQr''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwiaWF0IjoxNTE2MjM5MDIyfQ\.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30''',
  '''-----BEGIN PRIVATE KEY-----''',
  '''MIIEvAIBADANBgkqhkiG9w0BAQEFAASCBKYwggSiAgEAAoIBAQCu''',
  '''0123456789abcdef0123456789abcdef''',
]
paths = ['''(^|.*/)packages/ficta/test/secret-shapes\.test\.ts$''']

[[allowlists]]
description = "Synthetic commercial-code boundary value outside conventional test directories."
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''BLUE-ORCHID-42''']
paths = [
  '''(^|.*/)packages/ficta/bench/fixtures/pii-legal-identity\.json$''',
  '''(^|.*/)packages/ficta/presidio/ficta_presidio/test_identity_recognizer\.py$''',
]

[[allowlists]]
description = "Synthetic labelled-password, card, and surrogate-key inputs in the destroy-disposition test."
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''Tr0ub4dor&3x''', '''4111 1111 1111 1111''', '''destroy-disposition-surrogate-key-32-bytes-min''']
paths = ['''(^|.*/)packages/engine/test/destroy-disposition\.test\.ts$''']

[[allowlists]]
description = "Synthetic surrogate key, encryption-key pattern, and passphrase inputs in the persistent-vault test."
targetRules = ["generic-api-key"]
condition = "AND"
regexes = [
  '''vault-store-test-surrogate-key-at-least-32-bytes''',
  '''correct horse battery staple correct horse battery staple''',
]
paths = ['''(^|.*/)packages/engine/test/vault-store\.test\.ts$''']

[[allowlists]]
description = "Synthetic card and surrogate-key inputs in the ID-versus-card precedence tests (ID numbers are generated at runtime)."
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''4111 1111 1111 1111''', '''category-priority-surrogate-key-32-bytes-min''']
paths = [
  '''(^|.*/)packages/engine/test/category-priority\.test\.ts$''',
  '''(^|.*/)packages/ficta/presidio/ficta_presidio/test_span_precedence\.py$''',
]

[[allowlists]]
description = "Synthetic card, account number, surrogate-key and encryption-key inputs in the library facade test (the password is built at runtime)."
targetRules = ["generic-api-key"]
condition = "AND"
regexes = [
  '''facade-test-surrogate-key-at-least-32-bytes''',
  '''"c3"\.repeat\(32\)''',
  '''4111 1111 1111 1111''',
  '''40217733''',
]
paths = ['''(^|.*/)packages/engine/test/facade\.test\.ts$''']
